<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mundo - CurioNews</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            background: #061525;
            color: white;
            font-family: Arial, sans-serif;
        }

        .topo {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: #03101d;
            border-bottom: 1px solid #12314a;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: white;
        }

        .logo span {
            color: #00aaff;
        }

        .hero-mundo {
            min-height: 430px;
            padding: 50px;
            display: flex;
            align-items: end;

            background:
                linear-gradient(
                    to top,
                    rgba(3, 12, 22, 0.95),
                    rgba(3, 12, 22, 0.15)
                ),
                url("img/mundo.jpg");

            background-size: cover;
            background-position: center;
        }

        .hero-conteudo {
            max-width: 700px;
        }

        .hero-conteudo h1 {
            font-size: 64px;
            margin: 0 0 10px;
        }

        .hero-conteudo p {
            font-size: 20px;
            color: #d5e2ed;
            margin: 0;
        }

        .linha {
            width: 80px;
            height: 5px;
            background: #00aaff;
            margin: 18px 0;
            border-radius: 10px;
        }

        .conteudo {
            max-width: 1200px;
            margin: auto;
            padding: 45px 25px;
        }

        .titulo-secao {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .news-link {
            text-decoration: none;
            color: inherit;
        }

        .news-card {
            background: #0b1d2d;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #15364f;
            transition: 0.2s;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: #00aaff;
        }

        .news-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .news-body {
            padding: 20px;
        }

        .tag {
            color: #00aaff;
            font-size: 13px;
            font-weight: bold;
        }

        .news-body h3 {
            font-size: 21px;
            margin: 10px 0;
        }

        .news-body p {
            color: #aebdca;
            line-height: 1.5;
        }

        .meta {
            margin-top: 15px;
            color: #718596;
            font-size: 13px;
        }

        .carregando {
            color: #9fb1c1;
            font-size: 17px;
        }

        @media (max-width: 800px) {

            .hero-mundo {
                min-height: 350px;
                padding: 25px;
            }

            .hero-conteudo h1 {
                font-size: 45px;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3885802364653870"
     crossorigin="anonymous"></script>
</head>

<body>

    <header class="topo">

        <div class="logo">
            CURIO<span>NEWS</span>
        </div>

    </header>


    <section class="hero-mundo">

        <div class="hero-conteudo">

            <h1>🌎 MUNDO</h1>

            <div class="linha"></div>

            <p>
                Notícias do mundo e os principais acontecimentos internacionais.
            </p>

        </div>

    </section>


    <main class="conteudo">

        <h2 class="titulo-secao">
            Últimas notícias do mundo
        </h2>

        <div
            id="newsGrid"
            class="news-grid"
        >

            <p class="carregando">
                Carregando notícias...
            </p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>

    <script src="js/mundo-news.js"></script>

</body>

</html>
